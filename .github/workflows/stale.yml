name: Close Stale Issues and PRs

on:
  schedule:
    # Runs every day at 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch: # Allows you to run it manually from the Actions tab

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 30
          days-before-issue-close: 7
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-issue-message: "This issue has been inactive for 30 days and has been marked as stale. Please comment if it is still relevant, otherwise it will be closed in 7 days."
          close-issue-message: "This issue was closed automatically due to inactivity. Feel free to reopen it if needed."
          stale-pr-message: "This pull request has been inactive for 30 days and has been marked as stale. Please update or comment if you are still working on it, otherwise it will be closed in 7 days."
          close-pr-message: "This pull request was closed automatically due to inactivity."
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,enhancement"
          exempt-pr-labels: "pinned,security,work-in-progress"
